trigger: none
pr: none

parameters:
  - name: env
    displayName: Environment
    type: string
    default: nonprod
    values: [nonprod, prod]

variables:
  AWS_REGION: us-east-1
  AWS_SERVICE_CONNECTION: aws-cred

stages:
  - stage: DeployPlatform
    displayName: Deploy Platform Services
    jobs:
      - job: DeployTools
        displayName: Deploy Platform Tools
        pool:
          name: aws-self-hosted

        steps:
          - checkout: self

          - task: AWSShellScript@1
            displayName: Setup Cluster
            name: setup
            inputs:
              awsCredentials: $(AWS_SERVICE_CONNECTION)
              regionName: $(AWS_REGION)
              scriptType: inline
              inlineScript: |
                set -euo pipefail

                AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
                CLUSTER_NAME="$(aws eks list-clusters --query 'clusters[0]' --output text)"
                VPC_ID="$(aws eks describe-cluster --name "${CLUSTER_NAME}" --query 'cluster.resourcesVpcConfig.vpcId' --output text)"
                NLB_TG_ARN=$(aws elbv2 describe-target-groups --query "TargetGroups[?TargetGroupName=='nonprod-nlb-tg'].TargetGroupArn" --output text)
                
                aws eks update-kubeconfig --region "$(AWS_REGION)" --name "${CLUSTER_NAME}"
                
                echo "##vso[task.setvariable variable=AWS_ACCOUNT_ID]${AWS_ACCOUNT_ID}"
                echo "##vso[task.setvariable variable=CLUSTER_NAME]${CLUSTER_NAME}"
                echo "##vso[task.setvariable variable=VPC_ID]${VPC_ID}"
                echo "##vso[task.setvariable variable=NLB_TG_ARN]${NLB_TG_ARN}"
                echo "##vso[task.setvariable variable=AWS_ACCESS_KEY_ID;issecret=true]${AWS_ACCESS_KEY_ID}"
                echo "##vso[task.setvariable variable=AWS_SECRET_ACCESS_KEY;issecret=true]${AWS_SECRET_ACCESS_KEY}"
                echo "##vso[task.setvariable variable=AWS_SESSION_TOKEN;issecret=true]${AWS_SESSION_TOKEN:-}"

          - task: Bash@3
            displayName: Add Helm Repositories
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_SESSION_TOKEN: $(AWS_SESSION_TOKEN)
            inputs:
              targetType: inline
              script: |
                helm repo add eks https://aws.github.io/eks-charts
                helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
                helm repo add argo https://argoproj.github.io/argo-helm
                helm repo add external-secrets https://charts.external-secrets.io
                helm repo add sonarqube https://SonarSource.github.io/helm-chart-sonarqube
                helm repo update

          - task: Bash@3
            displayName: Cleanup Stuck Helm Releases
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_SESSION_TOKEN: $(AWS_SESSION_TOKEN)
            inputs:
              targetType: inline
              script: |
                set -e
                
                echo "Checking for stuck Helm releases..."
                
                # Check and cleanup AWS Load Balancer Controller
                if helm status aws-load-balancer-controller -n kube-system 2>/dev/null | grep -q "pending"; then
                  echo "Found stuck aws-load-balancer-controller release, cleaning up..."
                  helm rollback aws-load-balancer-controller 0 -n kube-system --wait || true
                  kubectl -n kube-system delete secret sh.helm.release.v1.aws-load-balancer-controller.v1 --ignore-not-found=true
                fi
                
                # Check and cleanup NGINX Ingress Controller
                if helm status ingress-nginx -n ingress-nginx 2>/dev/null | grep -q "pending"; then
                  echo "Found stuck ingress-nginx release, cleaning up..."
                  helm rollback ingress-nginx 0 -n ingress-nginx --wait || true
                  kubectl -n ingress-nginx delete secret sh.helm.release.v1.ingress-nginx.v1 --ignore-not-found=true
                fi
                
                echo "Cleanup complete"

          - task: Bash@3
            displayName: Create ServiceAccount for AWS Load Balancer Controller
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_SESSION_TOKEN: $(AWS_SESSION_TOKEN)
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                
                echo "Creating ServiceAccount with IRSA annotation..."
                
                cat <<EOF | kubectl apply -f -
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: aws-load-balancer-controller
                  namespace: kube-system
                  annotations:
                    eks.amazonaws.com/role-arn: arn:aws:iam::$(AWS_ACCOUNT_ID):role/$(CLUSTER_NAME)-aws_load_balancer_controller-irsa
                EOF
                
                kubectl get sa aws-load-balancer-controller -n kube-system -o yaml

          - task: HelmDeploy@1
            displayName: Install AWS Load Balancer Controller
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_SESSION_TOKEN: $(AWS_SESSION_TOKEN)
            inputs:
              connectionType: None
              namespace: kube-system
              command: upgrade
              chartType: Name
              chartName: eks/aws-load-balancer-controller
              releaseName: aws-load-balancer-controller
              install: true
              waitForExecution: true
              arguments: >
                --timeout 10m
                --set clusterName=$(CLUSTER_NAME)
                --set serviceAccount.create=false
                --set serviceAccount.name=aws-load-balancer-controller
                --set region=$(AWS_REGION)
                --set vpcId=$(VPC_ID)

          - task: HelmDeploy@1
            displayName: Install NGINX Ingress Controller
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_SESSION_TOKEN: $(AWS_SESSION_TOKEN)
            inputs:
              connectionType: None
              namespace: ingress-nginx
              command: upgrade
              chartType: Name
              chartName: ingress-nginx/ingress-nginx
              releaseName: ingress-nginx
              install: true
              waitForExecution: true
              arguments: >
                --create-namespace
                --timeout 10m
                --set controller.tolerations[0].key=platform
                --set controller.tolerations[0].operator=Equal
                --set-string controller.tolerations[0].value=true
                --set controller.tolerations[0].effect=NoSchedule
                --set controller.admissionWebhooks.patch.tolerations[0].key=platform
                --set controller.admissionWebhooks.patch.tolerations[0].operator=Equal
                --set-string controller.admissionWebhooks.patch.tolerations[0].value=true
                --set controller.admissionWebhooks.patch.tolerations[0].effect=NoSchedule
                --set controller.service.type=ClusterIP

          - task: Bash@3
            displayName: Create TargetGroupBinding for NLB
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_SESSION_TOKEN: $(AWS_SESSION_TOKEN)
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                
                sed "s|TARGET_GROUP_ARN_PLACEHOLDER|$(NLB_TG_ARN)|g" k8s-config/targetgroup-binding.yaml | kubectl apply -f -
                
                sleep 10
                kubectl get targetgroupbinding ingress-nlb-tgb -n ingress-nginx
                kubectl describe targetgroupbinding ingress-nlb-tgb -n ingress-nginx

          - task: HelmDeploy@1
            displayName: Install External Secrets Operator
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_SESSION_TOKEN: $(AWS_SESSION_TOKEN)
            inputs:
              connectionType: None
              namespace: external-secrets
              command: upgrade
              chartType: Name
              chartName: external-secrets/external-secrets
              releaseName: external-secrets
              install: true
              waitForExecution: true
              arguments: >
                --create-namespace
                --timeout 10m
                --set tolerations[0].key=platform
                --set tolerations[0].operator=Equal
                --set-string tolerations[0].value=true
                --set tolerations[0].effect=NoSchedule
                --set webhook.tolerations[0].key=platform
                --set webhook.tolerations[0].operator=Equal
                --set-string webhook.tolerations[0].value=true
                --set webhook.tolerations[0].effect=NoSchedule
                --set certController.tolerations[0].key=platform
                --set certController.tolerations[0].operator=Equal
                --set-string certController.tolerations[0].value=true
                --set certController.tolerations[0].effect=NoSchedule
                --set installCRDs=true
                --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=arn:aws:iam::$(AWS_ACCOUNT_ID):role/$(CLUSTER_NAME)-external_secrets-irsa

          - task: HelmDeploy@1
            displayName: Install Argo CD
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_SESSION_TOKEN: $(AWS_SESSION_TOKEN)
            inputs:
              connectionType: None
              namespace: argocd
              command: upgrade
              chartType: Name
              chartName: argo/argo-cd
              releaseName: argocd
              install: true
              waitForExecution: true
              arguments: >
                --create-namespace
                --timeout 10m
                --set controller.tolerations[0].key=platform
                --set controller.tolerations[0].operator=Equal
                --set-string controller.tolerations[0].value=true
                --set controller.tolerations[0].effect=NoSchedule
                --set server.tolerations[0].key=platform
                --set server.tolerations[0].operator=Equal
                --set-string server.tolerations[0].value=true
                --set server.tolerations[0].effect=NoSchedule
                --set repoServer.tolerations[0].key=platform
                --set repoServer.tolerations[0].operator=Equal
                --set-string repoServer.tolerations[0].value=true
                --set repoServer.tolerations[0].effect=NoSchedule
                --set redis.tolerations[0].key=platform
                --set redis.tolerations[0].operator=Equal
                --set-string redis.tolerations[0].value=true
                --set redis.tolerations[0].effect=NoSchedule

          - task: HelmDeploy@1
            displayName: Install SonarQube
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_SESSION_TOKEN: $(AWS_SESSION_TOKEN)
            inputs:
              connectionType: None
              namespace: sonarqube
              command: upgrade
              chartType: Name
              chartName: sonarqube/sonarqube
              releaseName: sonarqube
              install: true
              waitForExecution: true
              arguments: >
                --create-namespace
                --timeout 15m
                --set tolerations[0].key=platform
                --set tolerations[0].operator=Equal
                --set-string tolerations[0].value=true
                --set tolerations[0].effect=NoSchedule
                --set postgresql.primary.tolerations[0].key=platform
                --set postgresql.primary.tolerations[0].operator=Equal
                --set-string postgresql.primary.tolerations[0].value=true
                --set postgresql.primary.tolerations[0].effect=NoSchedule

          - task: Bash@3
            displayName: Apply Platform Ingress Routes
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_SESSION_TOKEN: $(AWS_SESSION_TOKEN)
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                kubectl apply -f k8s-config/platform-ingress.yaml
                
                sleep 5
                kubectl get ingress -A

          - task: AWSShellScript@1
            displayName: Verify NLB Target Registration
            inputs:
              awsCredentials: $(AWS_SERVICE_CONNECTION)
              regionName: $(AWS_REGION)
              scriptType: inline
              inlineScript: |
                set -euo pipefail
                
                sleep 20
                TARGET_HEALTH=$(aws elbv2 describe-target-health --target-group-arn "$(NLB_TG_ARN)")
                HEALTHY_COUNT=$(echo "${TARGET_HEALTH}" | jq -r '.TargetHealthDescriptions[] | select(.TargetHealth.State == "healthy") | .Target.Id' | wc -l)
                TOTAL_COUNT=$(echo "${TARGET_HEALTH}" | jq -r '.TargetHealthDescriptions | length')
                
                echo "Target health: ${HEALTHY_COUNT}/${TOTAL_COUNT} healthy"
                echo "${TARGET_HEALTH}" | jq -r '.TargetHealthDescriptions[] | "\(.Target.Id): \(.TargetHealth.State)"'