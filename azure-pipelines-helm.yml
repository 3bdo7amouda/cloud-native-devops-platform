trigger: none
pr: none

parameters:
  - name: env
    displayName: Environment
    type: string
    default: nonprod
    values: [nonprod, prod]

variables:
  AWS_REGION: us-east-1
  AWS_SERVICE_CONNECTION: aws-cred

stages:
  - stage: DeployPlatform
    displayName: Deploy Platform Services
    jobs:
      - job: Setup
        displayName: Configure Cluster Access
        pool:
          name: aws-self-hosted
        steps:
          - task: AWSCLI@1
            displayName: Configure AWS credentials
            inputs:
              awsCredentials: $(AWS_SERVICE_CONNECTION)
              regionName: $(AWS_REGION)
              awsCommand: eks
              awsSubCommand: list-clusters
              awsArguments: --query 'clusters[0]' --output text
            name: getCluster
          
          - task: Bash@3
            displayName: Export cluster info
            inputs:
              targetType: inline
              script: |
                CLUSTER_NAME=$(aws eks list-clusters --query 'clusters[0]' --output text)
                VPC_ID=$(aws eks describe-cluster --name "$CLUSTER_NAME" --query 'cluster.resourcesVpcConfig.vpcId' --output text)
                echo "##vso[task.setvariable variable=CLUSTER_NAME;isOutput=true]$CLUSTER_NAME"
                echo "##vso[task.setvariable variable=VPC_ID;isOutput=true]$VPC_ID"
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_DEFAULT_REGION: $(AWS_REGION)
            name: clusterInfo

      - job: DeployTools
        displayName: Deploy Platform Tools
        dependsOn: Setup
        pool:
          name: aws-self-hosted
        variables:
          CLUSTER_NAME: $[ dependencies.Setup.outputs['clusterInfo.CLUSTER_NAME'] ]
          VPC_ID: $[ dependencies.Setup.outputs['clusterInfo.VPC_ID'] ]
        steps:
          - task: KubectlInstaller@0
            displayName: Install kubectl
            inputs:
              kubectlVersion: latest

          - task: AWSCLI@1
            displayName: Configure kubeconfig
            inputs:
              awsCredentials: $(AWS_SERVICE_CONNECTION)
              regionName: $(AWS_REGION)
              awsCommand: eks
              awsSubCommand: update-kubeconfig
              awsArguments: --name $(CLUSTER_NAME) --region $(AWS_REGION)

          - task: Bash@3
            displayName: Add Helm repositories
            inputs:
              targetType: inline
              script: |
                helm repo add eks https://aws.github.io/eks-charts
                helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
                helm repo add jetstack https://charts.jetstack.io
                helm repo add argo https://argoproj.github.io/argo-helm
                helm repo add hashicorp https://helm.releases.hashicorp.com
                helm repo add external-secrets https://charts.external-secrets.io
                helm repo update

          - task: HelmDeploy@0
            displayName: Install AWS Load Balancer Controller
            inputs:
              connectionType: None
              namespace: kube-system
              command: upgrade
              chartType: Name
              chartName: eks/aws-load-balancer-controller
              releaseName: aws-load-balancer-controller
              overrideValues: clusterName=$(CLUSTER_NAME),region=$(AWS_REGION),vpcId=$(VPC_ID)
              install: true
              waitForExecution: true
              arguments: --timeout 10m

          - task: HelmDeploy@0
            displayName: Install ingress-nginx
            inputs:
              connectionType: None
              namespace: ingress-nginx
              command: upgrade
              chartType: Name
              chartName: ingress-nginx/ingress-nginx
              releaseName: ingress-nginx
              overrideValues: |
                controller.service.type=LoadBalancer
                controller.service.annotations."service\.beta\.kubernetes\.io/aws-load-balancer-type"=nlb
                controller.service.annotations."service\.beta\.kubernetes\.io/aws-load-balancer-scheme"=internet-facing
              install: true
              waitForExecution: true
              arguments: --create-namespace --timeout 10m

          - task: HelmDeploy@0
            displayName: Install cert-manager
            inputs:
              connectionType: None
              namespace: cert-manager
              command: upgrade
              chartType: Name
              chartName: jetstack/cert-manager
              releaseName: cert-manager
              overrideValues: installCRDs=true
              install: true
              waitForExecution: true
              arguments: --create-namespace --timeout 10m

          - task: HelmDeploy@0
            displayName: Install Argo CD
            inputs:
              connectionType: None
              namespace: argocd
              command: upgrade
              chartType: Name
              chartName: argo/argo-cd
              releaseName: argocd
              install: true
              waitForExecution: true
              arguments: --create-namespace --timeout 10m

          - task: HelmDeploy@0
            displayName: Install Vault
            inputs:
              connectionType: None
              namespace: vault
              command: upgrade
              chartType: Name
              chartName: hashicorp/vault
              releaseName: vault
              overrideValues: server.dev.enabled=true,server.dev.devRootToken=root
              install: true
              waitForExecution: true
              arguments: --create-namespace --timeout 10m

          - task: HelmDeploy@0
            displayName: Install External Secrets Operator
            inputs:
              connectionType: None
              namespace: external-secrets
              command: upgrade
              chartType: Name
              chartName: external-secrets/external-secrets
              releaseName: external-secrets
              install: true
              waitForExecution: true
              arguments: --create-namespace --timeout 10m