trigger: none
pr: none

parameters:
  - name: env
    displayName: Environment
    type: string
    default: nonprod
    values: [nonprod, prod]

variables:
  AWS_REGION: us-east-1
  TF_DIR: terraform

stages:
  - stage: DeployPlatform
    displayName: Deploy Platform
    jobs:
      - job: Deploy
        displayName: Deploy Controllers & Tools
        pool:
          name: aws-self-hosted

        steps:
          - checkout: self

          - task: Bash@3
            displayName: Get Infrastructure Info from AWS
            name: outputs
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                
                # Get EKS cluster name from AWS
                CLUSTER_NAME=$(aws eks list-clusters --region $(AWS_REGION) --query 'clusters[0]' --output text)
                echo "Found EKS Cluster: $CLUSTER_NAME"
                
                # Get AWS Account ID
                ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
                echo "AWS Account ID: $ACCOUNT_ID"
                
                # Get NLB information by tags
                NLB_ARN=$(aws elbv2 describe-load-balancers \
                  --region $(AWS_REGION) \
                  --query "LoadBalancers[?contains(LoadBalancerName, 'platform-nlb')].LoadBalancerArn" \
                  --output text | head -1)
                
                if [ -z "$NLB_ARN" ]; then
                  echo "Warning: NLB not found by name, searching by type..."
                  NLB_ARN=$(aws elbv2 describe-load-balancers \
                    --region $(AWS_REGION) \
                    --query "LoadBalancers[?Type=='network'].LoadBalancerArn" \
                    --output text | head -1)
                fi
                
                echo "NLB ARN: $NLB_ARN"
                
                # Get NLB DNS name
                NLB_DNS=$(aws elbv2 describe-load-balancers \
                  --region $(AWS_REGION) \
                  --load-balancer-arns "$NLB_ARN" \
                  --query 'LoadBalancers[0].DNSName' \
                  --output text)
                
                echo "NLB DNS: $NLB_DNS"
                
                # Get NLB target group ARN
                NLB_TG_ARN=$(aws elbv2 describe-target-groups \
                  --region $(AWS_REGION) \
                  --load-balancer-arn "$NLB_ARN" \
                  --query 'TargetGroups[0].TargetGroupArn' \
                  --output text)
                
                echo "NLB Target Group ARN: $NLB_TG_ARN"
                
                # Set pipeline variables
                echo "##vso[task.setvariable variable=CLUSTER_NAME;isOutput=true]$CLUSTER_NAME"
                echo "##vso[task.setvariable variable=NLB_TG_ARN;isOutput=true]$NLB_TG_ARN"
                echo "##vso[task.setvariable variable=NLB_DNS;isOutput=true]$NLB_DNS"
                echo "##vso[task.setvariable variable=ACCOUNT_ID;isOutput=true]$ACCOUNT_ID"
                echo "##vso[task.setvariable variable=NLB_ARN;isOutput=true]$NLB_ARN"

          - task: Bash@3
            displayName: Configure kubectl
            inputs:
              targetType: inline
              script: |
                aws eks update-kubeconfig --region $(AWS_REGION) --name $(outputs.CLUSTER_NAME)
                kubectl get nodes

          - task: HelmInstaller@1
            displayName: Install Helm
            inputs:
              helmVersionToInstall: 3.14.0

          - task: Bash@3
            displayName: Add Helm Repos
            inputs:
              targetType: inline
              script: |
                helm repo add eks https://aws.github.io/eks-charts
                helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
                helm repo add argo https://argoproj.github.io/argo-helm
                helm repo add external-secrets https://charts.external-secrets.io
                helm repo add sonarqube https://SonarSource.github.io/helm-chart-sonarqube
                helm repo update

          - task: Kubernetes@1
            displayName: Create AWS LBC ServiceAccount
            inputs:
              connectionType: None
              command: apply
              useConfigurationFile: true
              configuration: |
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: aws-load-balancer-controller
                  namespace: kube-system
                  annotations:
                    eks.amazonaws.com/role-arn: arn:aws:iam::$(outputs.ACCOUNT_ID):role/$(outputs.CLUSTER_NAME)-aws_load_balancer_controller-irsa

          - task: HelmDeploy@1
            displayName: Deploy AWS Load Balancer Controller
            inputs:
              connectionType: None
              namespace: kube-system
              command: upgrade
              chartType: Name
              chartName: eks/aws-load-balancer-controller
              releaseName: aws-load-balancer-controller
              install: true
              waitForExecution: true
              arguments: |
                --set clusterName=$(outputs.CLUSTER_NAME)
                --set serviceAccount.create=false
                --set serviceAccount.name=aws-load-balancer-controller
                --set region=$(AWS_REGION)
                --timeout 15m

          - task: Kubernetes@1
            displayName: Verify AWS LBC Deployment
            inputs:
              connectionType: None
              command: get
              arguments: deployment aws-load-balancer-controller -n kube-system

          - task: Kubernetes@1
            displayName: Verify TargetGroupBindings CRD
            inputs:
              connectionType: None
              command: get
              arguments: crd targetgroupbindings.elbv2.k8s.aws

          - task: HelmDeploy@1
            displayName: Deploy NGINX Ingress
            inputs:
              connectionType: None
              namespace: ingress-nginx
              command: upgrade
              chartType: Name
              chartName: ingress-nginx/ingress-nginx
              releaseName: ingress-nginx
              install: true
              waitForExecution: true
              arguments: |
                --create-namespace
                --set controller.service.type=ClusterIP
                --set-string controller.tolerations[0].key=platform
                --set-string controller.tolerations[0].operator=Equal
                --set-string controller.tolerations[0].value=true
                --set-string controller.tolerations[0].effect=NoSchedule
                --set-string controller.admissionWebhooks.patch.tolerations[0].key=platform
                --set-string controller.admissionWebhooks.patch.tolerations[0].operator=Equal
                --set-string controller.admissionWebhooks.patch.tolerations[0].value=true
                --set-string controller.admissionWebhooks.patch.tolerations[0].effect=NoSchedule
                --timeout 10m

          - task: Kubernetes@1
            displayName: Create TargetGroupBinding
            inputs:
              connectionType: None
              command: apply
              useConfigurationFile: true
              configuration: |
                apiVersion: elbv2.k8s.aws/v1beta1
                kind: TargetGroupBinding
                metadata:
                  name: ingress-nlb-tgb
                  namespace: ingress-nginx
                spec:
                  targetGroupARN: $(outputs.NLB_TG_ARN)
                  targetType: ip
                  serviceRef:
                    name: ingress-nginx-controller
                    port: 80

          - task: Kubernetes@1
            displayName: Get TargetGroupBinding Status
            inputs:
              connectionType: None
              command: get
              arguments: targetgroupbinding ingress-nlb-tgb -n ingress-nginx

          - task: HelmDeploy@1
            displayName: Deploy Argo CD
            inputs:
              connectionType: None
              namespace: argocd
              command: upgrade
              chartType: Name
              chartName: argo/argo-cd
              releaseName: argocd
              install: true
              waitForExecution: true
              arguments: |
                --create-namespace
                --set server.service.type=ClusterIP
                --set server.ingress.enabled=false
                --set-string server.tolerations[0].key=platform
                --set-string server.tolerations[0].operator=Equal
                --set-string server.tolerations[0].value=true
                --set-string server.tolerations[0].effect=NoSchedule
                --set-string controller.tolerations[0].key=platform
                --set-string controller.tolerations[0].operator=Equal
                --set-string controller.tolerations[0].value=true
                --set-string controller.tolerations[0].effect=NoSchedule
                --set-string repoServer.tolerations[0].key=platform
                --set-string repoServer.tolerations[0].operator=Equal
                --set-string repoServer.tolerations[0].value=true
                --set-string repoServer.tolerations[0].effect=NoSchedule
                --set-string redis.tolerations[0].key=platform
                --set-string redis.tolerations[0].operator=Equal
                --set-string redis.tolerations[0].value=true
                --set-string redis.tolerations[0].effect=NoSchedule
                --timeout 10m

          - task: Kubernetes@1
            displayName: Apply Ingress Routes
            inputs:
              connectionType: None
              command: apply
              useConfigurationFile: true
              configurationType: filePath
              configuration: k8s-config/platform-ingress.yaml

          - task: Bash@3
            displayName: Get ArgoCD Access Info
            inputs:
              targetType: inline
              script: |
                echo "NLB DNS: $(outputs.NLB_DNS)"
                echo "Argo CD: http://$(outputs.NLB_DNS)/api/argocd"
                echo "Username: admin"
                echo -n "Password: "
                kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d

          - task: HelmDeploy@1
            displayName: Deploy External Secrets
            inputs:
              connectionType: None
              namespace: external-secrets
              command: upgrade
              chartType: Name
              chartName: external-secrets/external-secrets
              releaseName: external-secrets
              install: true
              waitForExecution: true
              arguments: |
                --create-namespace
                --set installCRDs=true
                --set-string tolerations[0].key=platform
                --set-string tolerations[0].operator=Equal
                --set-string tolerations[0].value=true
                --set-string tolerations[0].effect=NoSchedule
                --timeout 10m

          - task: HelmDeploy@1
            displayName: Deploy SonarQube
            inputs:
              connectionType: None
              namespace: sonarqube
              command: upgrade
              chartType: Name
              chartName: sonarqube/sonarqube
              releaseName: sonarqube
              install: true
              waitForExecution: true
              arguments: |
                --create-namespace
                --set-string tolerations[0].key=platform
                --set-string tolerations[0].operator=Equal
                --set-string tolerations[0].value=true
                --set-string tolerations[0].effect=NoSchedule
                --timeout 15m