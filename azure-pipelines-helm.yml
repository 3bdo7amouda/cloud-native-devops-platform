trigger: none
pr: none

parameters:
  - name: env
    displayName: Environment
    type: string
    default: nonprod
    values: [nonprod, prod]

variables:
  AWS_REGION: us-east-1
  AWS_SERVICE_CONNECTION: aws-cred

stages:
- stage: DeployPlatform
  displayName: Deploy Platform
  jobs:
  - job: Deploy
    displayName: Deploy Platform Tools
    pool:
      name: aws-self-hosted

    steps:
    - checkout: self

    - task: AWSShellScript@1
      displayName: Get Infrastructure Info
      name: info
      inputs:
        awsCredentials: $(AWS_SERVICE_CONNECTION)
        regionName: $(AWS_REGION)
        scriptType: inline
        inlineScript: |
          set -euo pipefail

          CLUSTER="${{ parameters.env }}-eks"
          aws eks describe-cluster --name "$CLUSTER" >/dev/null 2>&1 || \
            CLUSTER=$(aws eks list-clusters --query 'clusters[0]' --output text)

          aws eks update-kubeconfig --region $(AWS_REGION) --name $CLUSTER

          echo "##vso[task.setvariable variable=CLUSTER_NAME;isOutput=true]$CLUSTER"

    - task: Bash@3
      displayName: Add Helm Repos
      inputs:
        targetType: inline
        script: |
          set -e
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update

    - task: HelmDeploy@1
      displayName: Deploy NGINX Ingress
      inputs:
        connectionType: None
        namespace: ingress-nginx
        command: upgrade
        chartType: Name
        chartName: ingress-nginx/ingress-nginx
        releaseName: ingress-nginx
        install: true
        waitForExecution: true
        arguments: >-
          --create-namespace
          --version 4.14.3
          --set controller.service.type=LoadBalancer
          --set controller.service.annotations."service\.beta\.kubernetes\.io/aws-load-balancer-type"="nlb"
          --set controller.service.annotations."service\.beta\.kubernetes\.io/aws-load-balancer-nlb-target-type"="ip"
          --set controller.service.annotations."service\.beta\.kubernetes\.io/aws-load-balancer-scheme"="internal"
          --set controller.ingressClassResource.name=nginx
          --timeout 10m

    - task: Bash@3
      displayName: Wait for NGINX Controller
      inputs:
        targetType: inline
        script: |
          kubectl -n ingress-nginx wait --for=condition=Available deployment/ingress-nginx-controller --timeout=10m

    - task: HelmDeploy@1
      displayName: Deploy ArgoCD
      inputs:
        connectionType: None
        namespace: argocd
        command: upgrade
        chartType: Name
        chartName: argo/argo-cd
        releaseName: argocd
        install: true
        waitForExecution: true
        arguments: >-
          --create-namespace
          --set server.service.type=ClusterIP
          --set configs.params.server.basehref=/api/argocd
          --set configs.params.server.rootpath=/api/argocd
          --timeout 10m

    - task: Bash@3
      displayName: Apply Platform Ingress
      inputs:
        targetType: inline
        script: |
          kubectl apply -f k8s-config/platform-ingress.yaml
          kubectl get ingress -A