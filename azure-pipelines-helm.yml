trigger: none
pr: none

parameters:
  - name: env
    displayName: Environment
    type: string
    default: nonprod
    values: [nonprod, prod]

variables:
  AWS_REGION: us-east-1
  TF_DIR: terraform

stages:
  - stage: DeployPlatform
    displayName: Deploy Platform
    jobs:
      - job: Deploy
        displayName: Deploy Controllers & Tools
        pool:
          name: Default

        steps:
          - checkout: self

          - task: Bash@3
            displayName: Get Infrastructure Outputs
            name: outputs
            inputs:
              targetType: inline
              script: |
                cd $(TF_DIR)
                terraform init -input=false
                
                CLUSTER_NAME=$(terraform output -raw cluster_name)
                NLB_TG_ARN=$(terraform output -raw nlb_target_group_arn)
                NLB_DNS=$(terraform output -raw nlb_dns_name)
                ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
                
                echo "##vso[task.setvariable variable=CLUSTER_NAME;isOutput=true]$CLUSTER_NAME"
                echo "##vso[task.setvariable variable=NLB_TG_ARN;isOutput=true]$NLB_TG_ARN"
                echo "##vso[task.setvariable variable=NLB_DNS;isOutput=true]$NLB_DNS"
                echo "##vso[task.setvariable variable=ACCOUNT_ID;isOutput=true]$ACCOUNT_ID"
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_DEFAULT_REGION: $(AWS_REGION)

          - task: Bash@3
            displayName: Configure kubectl
            inputs:
              targetType: inline
              script: |
                aws eks update-kubeconfig --region $(AWS_REGION) --name $(outputs.CLUSTER_NAME)
                kubectl get nodes
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_DEFAULT_REGION: $(AWS_REGION)

          - task: Bash@3
            displayName: Add Helm Repos
            inputs:
              targetType: inline
              script: |
                helm repo add eks https://aws.github.io/eks-charts
                helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
                helm repo add argo https://argoproj.github.io/argo-helm
                helm repo add external-secrets https://charts.external-secrets.io
                helm repo add sonarqube https://SonarSource.github.io/helm-chart-sonarqube
                helm repo update

          - task: Kubernetes@1
            displayName: Create AWS LBC ServiceAccount
            inputs:
              connectionType: None
              command: apply
              useConfigurationFile: true
              configuration: |
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: aws-load-balancer-controller
                  namespace: kube-system
                  annotations:
                    eks.amazonaws.com/role-arn: arn:aws:iam::$(outputs.ACCOUNT_ID):role/$(outputs.CLUSTER_NAME)-aws_load_balancer_controller-irsa

          - task: HelmDeploy@1
            displayName: Deploy AWS Load Balancer Controller
            inputs:
              connectionType: None
              namespace: kube-system
              command: upgrade
              chartType: Name
              chartName: eks/aws-load-balancer-controller
              releaseName: aws-load-balancer-controller
              install: true
              waitForExecution: true
              arguments: |
                --set clusterName=$(outputs.CLUSTER_NAME)
                --set serviceAccount.create=false
                --set serviceAccount.name=aws-load-balancer-controller
                --set region=$(AWS_REGION)
                --timeout 15m

          - task: HelmDeploy@1
            displayName: Deploy NGINX Ingress
            inputs:
              connectionType: None
              namespace: ingress-nginx
              command: upgrade
              chartType: Name
              chartName: ingress-nginx/ingress-nginx
              releaseName: ingress-nginx
              install: true
              waitForExecution: true
              arguments: |
                --create-namespace
                --set controller.service.type=ClusterIP
                --set-string controller.tolerations[0].key=platform
                --set-string controller.tolerations[0].operator=Equal
                --set-string controller.tolerations[0].value=true
                --set-string controller.tolerations[0].effect=NoSchedule
                --set-string controller.admissionWebhooks.patch.tolerations[0].key=platform
                --set-string controller.admissionWebhooks.patch.tolerations[0].operator=Equal
                --set-string controller.admissionWebhooks.patch.tolerations[0].value=true
                --set-string controller.admissionWebhooks.patch.tolerations[0].effect=NoSchedule
                --timeout 10m

          - task: Kubernetes@1
            displayName: Create TargetGroupBinding
            inputs:
              connectionType: None
              command: apply
              useConfigurationFile: true
              configuration: |
                apiVersion: elbv2.k8s.aws/v1beta1
                kind: TargetGroupBinding
                metadata:
                  name: ingress-nlb-tgb
                  namespace: ingress-nginx
                spec:
                  targetGroupARN: $(outputs.NLB_TG_ARN)
                  targetType: ip
                  serviceRef:
                    name: ingress-nginx-controller
                    port: 80

          - task: HelmDeploy@1
            displayName: Deploy Argo CD
            inputs:
              connectionType: None
              namespace: argocd
              command: upgrade
              chartType: Name
              chartName: argo/argo-cd
              releaseName: argocd
              install: true
              waitForExecution: true
              arguments: |
                --create-namespace
                --set server.service.type=ClusterIP
                --set server.ingress.enabled=false
                --set-string server.tolerations[0].key=platform
                --set-string server.tolerations[0].operator=Equal
                --set-string server.tolerations[0].value=true
                --set-string server.tolerations[0].effect=NoSchedule
                --set-string controller.tolerations[0].key=platform
                --set-string controller.tolerations[0].operator=Equal
                --set-string controller.tolerations[0].value=true
                --set-string controller.tolerations[0].effect=NoSchedule
                --set-string repoServer.tolerations[0].key=platform
                --set-string repoServer.tolerations[0].operator=Equal
                --set-string repoServer.tolerations[0].value=true
                --set-string repoServer.tolerations[0].effect=NoSchedule
                --set-string redis.tolerations[0].key=platform
                --set-string redis.tolerations[0].operator=Equal
                --set-string redis.tolerations[0].value=true
                --set-string redis.tolerations[0].effect=NoSchedule
                --timeout 10m

          - task: Kubernetes@1
            displayName: Apply Ingress Routes
            inputs:
              connectionType: None
              command: apply
              useConfigurationFile: true
              configurationType: filePath
              configuration: k8s-config/platform-ingress.yaml

          - task: HelmDeploy@1
            displayName: Deploy External Secrets
            inputs:
              connectionType: None
              namespace: external-secrets
              command: upgrade
              chartType: Name
              chartName: external-secrets/external-secrets
              releaseName: external-secrets
              install: true
              waitForExecution: true
              arguments: |
                --create-namespace
                --set installCRDs=true
                --set-string tolerations[0].key=platform
                --set-string tolerations[0].operator=Equal
                --set-string tolerations[0].value=true
                --set-string tolerations[0].effect=NoSchedule
                --timeout 10m

          - task: HelmDeploy@1
            displayName: Deploy SonarQube
            inputs:
              connectionType: None
              namespace: sonarqube
              command: upgrade
              chartType: Name
              chartName: sonarqube/sonarqube
              releaseName: sonarqube
              install: true
              waitForExecution: true
              arguments: |
                --create-namespace
                --set-string tolerations[0].key=platform
                --set-string tolerations[0].operator=Equal
                --set-string tolerations[0].value=true
                --set-string tolerations[0].effect=NoSchedule
                --timeout 15m