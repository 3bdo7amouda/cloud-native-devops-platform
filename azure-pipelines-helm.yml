trigger: none
pr: none

parameters:
  - name: env
    displayName: Environment
    type: string
    default: nonprod
    values: [nonprod, prod]

variables:
  AWS_REGION: us-east-1
  AWS_SERVICE_CONNECTION: aws-cred

stages:
  - stage: DeployPlatform
    displayName: Deploy Platform
    jobs:
      - job: Deploy
        displayName: Deploy Platform Tools
        pool:
          name: aws-self-hosted

        steps:
          - checkout: self

          - task: AWSShellScript@1
            displayName: Get Infrastructure Info
            name: info
            inputs:
              awsCredentials: $(AWS_SERVICE_CONNECTION)
              regionName: $(AWS_REGION)
              scriptType: inline
              inlineScript: |
                set -euo pipefail
                ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
                CLUSTER_NAME=$(aws eks list-clusters --query 'clusters[0]' --output text)
                NLB_TG_ARN=$(aws elbv2 describe-target-groups --query "TargetGroups[?contains(TargetGroupName, 'nlb-tg')].TargetGroupArn" --output text | head -1)
                VPC_ID=$(aws ec2 describe-vpcs --query "Vpcs[0].VpcId" --output text)
                aws eks update-kubeconfig --region $(AWS_REGION) --name ${CLUSTER_NAME}
                echo "##vso[task.setvariable variable=ACCOUNT_ID;isOutput=true]${ACCOUNT_ID}"
                echo "##vso[task.setvariable variable=CLUSTER_NAME;isOutput=true]${CLUSTER_NAME}"
                echo "##vso[task.setvariable variable=NLB_TG_ARN;isOutput=true]${NLB_TG_ARN}"
                echo "##vso[task.setvariable variable=VPC_ID;isOutput=true]${VPC_ID}"

          - task: Bash@3
            displayName: Add Helm Repos
            inputs:
              targetType: inline
              script: |
                helm repo add eks https://aws.github.io/eks-charts
                helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
                helm repo add argo https://argoproj.github.io/argo-helm
                helm repo add external-secrets https://charts.external-secrets.io
                helm repo add sonarqube https://SonarSource.github.io/helm-chart-sonarqube
                helm repo update

          - task: Bash@3
            displayName: Create AWS LBC ServiceAccount
            inputs:
              targetType: inline
              script: |
                sed "s|ROLE_ARN_PLACEHOLDER|arn:aws:iam::$(info.ACCOUNT_ID):role/$(info.CLUSTER_NAME)-aws_load_balancer_controller-irsa|g" \
                  k8s-config/aws-lbc-serviceaccount.yaml | kubectl apply -f -

          - task: HelmDeploy@1
            displayName: Deploy AWS Load Balancer Controller
            inputs:
              connectionType: None
              namespace: kube-system
              command: upgrade
              chartType: Name
              chartName: eks/aws-load-balancer-controller
              releaseName: aws-load-balancer-controller
              install: true
              waitForExecution: true
              arguments: >-
                --set clusterName=$(info.CLUSTER_NAME)
                --set serviceAccount.create=false
                --set serviceAccount.name=aws-load-balancer-controller
                --set region=$(AWS_REGION)
                --set vpcId=$(info.VPC_ID)
                --set tolerations[0].key=platform
                --set tolerations[0].operator=Equal
                --set-string tolerations[0].value=true
                --set tolerations[0].effect=NoSchedule
                --timeout 10m

          - task: Bash@3
            displayName: Pre-clean ingress-nginx stuck/pending Helm release and hook Jobs
            inputs:
              targetType: inline
              script: |
                set -euo pipefail

                # If a previous pipeline run was cancelled or failed mid-install, Helm can leave the release in pending-install
                # and block subsequent upgrades with: "another operation (install/upgrade/rollback) is in progress".
                status=$(helm -n ingress-nginx status ingress-nginx 2>/dev/null | awk -F': ' '/^STATUS:/{print $2}' || true)
                if [[ "$status" == pending-install || "$status" == pending-upgrade || "$status" == pending-rollback ]]; then
                  echo "Found ingress-nginx Helm release in $status; cleaning up lock and leftover resources."

                  # Best-effort uninstall/rollback
                  helm -n ingress-nginx uninstall ingress-nginx 2>/dev/null || true

                  # Remove Helm release secret that keeps the lock (safe because release is stuck and we are reinstalling)
                  kubectl -n ingress-nginx delete secret sh.helm.release.v1.ingress-nginx.v1 --ignore-not-found || true
                fi

                # Always clean up stuck admission hook jobs/pods from old runs
                kubectl -n ingress-nginx delete job ingress-nginx-admission-create --ignore-not-found || true
                kubectl -n ingress-nginx delete job ingress-nginx-admission-patch --ignore-not-found || true
                kubectl -n ingress-nginx delete pod -l job-name=ingress-nginx-admission-create --ignore-not-found || true
                kubectl -n ingress-nginx delete pod -l job-name=ingress-nginx-admission-patch --ignore-not-found || true

          - task: Bash@3
            displayName: Pre-clean ingress-nginx stuck hook Jobs (if any)
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                # If a previous run created these, they can block subsequent upgrades.
                kubectl -n ingress-nginx delete job ingress-nginx-admission-create --ignore-not-found
                kubectl -n ingress-nginx delete job ingress-nginx-admission-patch --ignore-not-found
                # Also delete any pods created by those jobs.
                kubectl -n ingress-nginx delete pod -l job-name=ingress-nginx-admission-create --ignore-not-found
                kubectl -n ingress-nginx delete pod -l job-name=ingress-nginx-admission-patch --ignore-not-found

          - task: HelmDeploy@1
            displayName: Deploy NGINX Ingress
            inputs:
              connectionType: None
              namespace: ingress-nginx
              command: upgrade
              chartType: Name
              chartName: ingress-nginx/ingress-nginx
              releaseName: ingress-nginx
              install: true
              waitForExecution: true
              arguments: >-
                --create-namespace
                --set controller.service.type=ClusterIP
                --set controller.tolerations[0].key=platform
                --set controller.tolerations[0].operator=Equal
                --set-string controller.tolerations[0].value=true
                --set controller.tolerations[0].effect=NoSchedule
                --set admissionWebhooks.enabled=false
                --set defaultBackend.tolerations[0].key=platform
                --set defaultBackend.tolerations[0].operator=Equal
                --set-string defaultBackend.tolerations[0].value=true
                --set defaultBackend.tolerations[0].effect=NoSchedule
                --timeout 10m

          - task: Bash@3
            displayName: Verify ingress-nginx controller is running
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                kubectl -n ingress-nginx get pods
                kubectl -n ingress-nginx wait --for=condition=Available deployment/ingress-nginx-controller --timeout=10m

          - task: Bash@3
            displayName: Create TargetGroupBinding
            inputs:
              targetType: inline
              script: |
                sed "s|TG_ARN_PLACEHOLDER|$(info.NLB_TG_ARN)|g" \
                  k8s-config/targetgroup-binding.yaml | kubectl apply -f -

          - task: HelmDeploy@1
            displayName: Deploy ArgoCD
            inputs:
              connectionType: None
              namespace: argocd
              command: upgrade
              chartType: Name
              chartName: argo/argo-cd
              releaseName: argocd
              install: true
              waitForExecution: true
              arguments: >-
                --create-namespace
                --set server.service.type=ClusterIP
                --set server.tolerations[0].key=platform
                --set server.tolerations[0].operator=Equal
                --set-string server.tolerations[0].value=true
                --set server.tolerations[0].effect=NoSchedule
                --timeout 10m

          - task: HelmDeploy@1
            displayName: Deploy External Secrets
            inputs:
              connectionType: None
              namespace: external-secrets
              command: upgrade
              chartType: Name
              chartName: external-secrets/external-secrets
              releaseName: external-secrets
              install: true
              waitForExecution: true
              arguments: >-
                --create-namespace
                --set installCRDs=true
                --set tolerations[0].key=platform
                --set tolerations[0].operator=Equal
                --set-string tolerations[0].value=true
                --set tolerations[0].effect=NoSchedule
                --timeout 10m

          - task: HelmDeploy@1
            displayName: Deploy SonarQube
            inputs:
              connectionType: None
              namespace: sonarqube
              command: upgrade
              chartType: Name
              chartName: sonarqube/sonarqube
              releaseName: sonarqube
              install: true
              waitForExecution: true
              arguments: >-
                --create-namespace
                --set tolerations[0].key=platform
                --set tolerations[0].operator=Equal
                --set-string tolerations[0].value=true
                --set tolerations[0].effect=NoSchedule
                --timeout 10m

          - task: Kubernetes@1
            displayName: Apply Platform Ingress
            inputs:
              connectionType: None
              command: apply
              useConfigurationFile: true
              configurationType: filePath
              configuration: k8s-config/platform-ingress.yaml

          - task: Kubernetes@1
            displayName: Get ArgoCD Secret
            name: argocd
            inputs:
              connectionType: None
              command: get
              arguments: "secret argocd-initial-admin-secret -n argocd -o jsonpath={.data.password}"
              outputFormat: json

          - task: Bash@3
            displayName: Display Access Info
            inputs:
              targetType: inline
              script: |
                echo "ArgoCD Username: admin"
                echo "ArgoCD Password: $(echo $(argocd.KubectlOutput) | base64 -d)"