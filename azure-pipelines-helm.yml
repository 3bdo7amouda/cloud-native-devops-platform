trigger: none
pr: none

parameters:
  - name: env
    displayName: Environment
    type: string
    default: nonprod
    values: [nonprod, prod]

variables:
  AWS_REGION: us-east-1
  AWS_SERVICE_CONNECTION: aws-cred

stages:
- stage: DeployPlatform
  displayName: Deploy Platform
  jobs:
  - job: Deploy
    displayName: Deploy Platform Tools
    pool:
      name: aws-self-hosted

    steps:
    - checkout: self

    - task: AWSShellScript@1
      displayName: Get Infrastructure Info
      name: info
      inputs:
        awsCredentials: $(AWS_SERVICE_CONNECTION)
        regionName: $(AWS_REGION)
        scriptType: inline
        inlineScript: |
          set -euo pipefail

          CLUSTER="${{ parameters.env }}-eks"
          aws eks describe-cluster --name "$CLUSTER" >/dev/null 2>&1 || \
            CLUSTER=$(aws eks list-clusters --query 'clusters[0]' --output text)

          aws eks update-kubeconfig --region $(AWS_REGION) --name $CLUSTER

          echo "##vso[task.setvariable variable=CLUSTER_NAME;isOutput=true]$CLUSTER"

    - task: Bash@3
      displayName: Add Helm Repos
      inputs:
        targetType: inline
        script: |
          set -e
          helm repo add eks https://aws.github.io/eks-charts
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo add sonarqube https://SonarSource.github.io/helm-chart-sonarqube
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo update

    - task: AWSShellScript@1
      displayName: Install AWS Load Balancer Controller
      inputs:
        awsCredentials: $(AWS_SERVICE_CONNECTION)
        regionName: $(AWS_REGION)
        scriptType: inline
        inlineScript: |
          set -euo pipefail
          CLUSTER="${{ parameters.env }}-eks"
          aws eks describe-cluster --name "$CLUSTER" >/dev/null 2>&1 || \
            CLUSTER=$(aws eks list-clusters --query 'clusters[0]' --output text)

          VPC_ID=$(aws eks describe-cluster --name "$CLUSTER" --query 'cluster.resourcesVpcConfig.vpcId' --output text)
          ACCOUNT_ID=$(aws sts get-caller-identity --query 'Account' --output text)
          ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/${CLUSTER}-aws_load_balancer_controller-irsa"

          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --namespace kube-system \
            --set clusterName="$CLUSTER" \
            --set region="$(AWS_REGION)" \
            --set vpcId="$VPC_ID" \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set serviceAccount.annotations."eks\\.amazonaws\\.com/role-arn"="$ROLE_ARN" \
            --set enableWebhook=false \
            --wait --timeout 10m

          kubectl -n kube-system wait --for=condition=Available deployment/aws-load-balancer-controller --timeout=5m

    - task: Bash@3
      displayName: Remove AWS LB Controller Webhook
      inputs:
        targetType: inline
        script: |
          set -euo pipefail
          kubectl -n kube-system delete service aws-load-balancer-webhook-service --ignore-not-found
          kubectl -n kube-system delete secret aws-load-balancer-webhook-tls --ignore-not-found
          kubectl delete mutatingwebhookconfiguration aws-load-balancer-webhook --ignore-not-found
          kubectl delete validatingwebhookconfiguration aws-load-balancer-webhook --ignore-not-found

    # - task: HelmDeploy@1
    #   displayName: Deploy External Secrets
    #   inputs:
    #     connectionType: None
    #     namespace: external-secrets
    #     command: upgrade
    #     chartType: Name
    #     chartName: external-secrets/external-secrets
    #     releaseName: external-secrets
    #     install: true
    #     waitForExecution: true
    #     arguments: >-
    #       --create-namespace
    #       -f k8s-config/external-secrets-values.yaml
    #       --timeout 10m

    - task: HelmDeploy@1
      displayName: Deploy ArgoCD
      inputs:
        connectionType: None
        namespace: argocd
        command: upgrade
        chartType: Name
        chartName: argo/argo-cd
        releaseName: argocd
        install: true
        waitForExecution: true
        arguments: >-
          --create-namespace
          -f k8s-config/argocd-values.yaml
          --timeout 10m

    - task: HelmDeploy@1
      displayName: Deploy SonarQube
      inputs:
        connectionType: None
        namespace: sonarqube
        command: upgrade
        chartType: Name
        chartName: sonarqube/sonarqube
        releaseName: sonarqube
        install: true
        waitForExecution: true
        arguments: >-
          --create-namespace
          -f k8s-config/sonarqube-values.yaml
          --timeout 10m

    - task: Bash@3
      displayName: Apply Platform Ingress
      inputs:
        targetType: inline
        script: |
          set -euo pipefail
          ALB_NAME="${{ parameters.env }}-alb"
          NEXUS_ALB_NAME="${{ parameters.env }}-nexus-alb"
          TF_DIR="terraform"
          if [ -z "${NEXUS_CERT_ARN:-}" ] || [ "${NEXUS_CERT_ARN}" = "null" ]; then
            terraform -chdir="${TF_DIR}" init -input=false >/dev/null
            NEXUS_CERT_ARN="$(terraform -chdir="${TF_DIR}" output -raw nexus_registry_certificate_arn || true)"
          fi
          if [ -z "${NEXUS_DOMAIN:-}" ] || [ "${NEXUS_DOMAIN}" = "null" ]; then
            NEXUS_DOMAIN="$(terraform -chdir="${TF_DIR}" output -raw nexus_registry_domain || true)"
          fi
          if [ -z "${HOSTED_ZONE_ID:-}" ] || [ "${HOSTED_ZONE_ID}" = "null" ]; then
            HOSTED_ZONE_ID="$(terraform -chdir="${TF_DIR}" output -raw hosted_zone_id || true)"
          fi

          : "${NEXUS_CERT_ARN:?NEXUS_CERT_ARN is required to create HTTPS registry ingress}"
          : "${NEXUS_DOMAIN:?NEXUS_DOMAIN is required to create DNS alias}"
          : "${HOSTED_ZONE_ID:?HOSTED_ZONE_ID is required to create DNS alias}"

          kubectl apply -f k8s-config/healthz.yaml
          sed "s/__ALB_NAME__/${ALB_NAME}/g" k8s-config/ingress-argocd.yaml | kubectl apply -f -
          sed "s/__ALB_NAME__/${ALB_NAME}/g" k8s-config/ingress-sonarqube.yaml | kubectl apply -f -
          sed "s/__ALB_NAME__/${ALB_NAME}/g" k8s-config/ingress-nexus.yaml | kubectl apply -f -
          sed -e "s/__NEXUS_ALB_NAME__/${NEXUS_ALB_NAME}/g" -e "s#__NEXUS_CERT_ARN__#${NEXUS_CERT_ARN}#g" -e "s/__NEXUS_DOMAIN__/${NEXUS_DOMAIN}/g" k8s-config/ingress-nexus-registry.yaml | kubectl apply -f -
          sed "s/__ALB_NAME__/${ALB_NAME}/g" k8s-config/ingress-vault.yaml | kubectl apply -f -
          kubectl get ingress -A

          for i in $(seq 1 40); do
            NEXUS_ALB_DNS=$(aws elbv2 describe-load-balancers --names "$NEXUS_ALB_NAME" --query 'LoadBalancers[0].DNSName' --output text 2>/dev/null || true)
            NEXUS_ALB_ZONE=$(aws elbv2 describe-load-balancers --names "$NEXUS_ALB_NAME" --query 'LoadBalancers[0].CanonicalHostedZoneId' --output text 2>/dev/null || true)
            NEXUS_ALB_STATE=$(aws elbv2 describe-load-balancers --names "$NEXUS_ALB_NAME" --query 'LoadBalancers[0].State.Code' --output text 2>/dev/null || true)
            if [ -n "$NEXUS_ALB_DNS" ] && [ "$NEXUS_ALB_DNS" != "None" ] && [ "$NEXUS_ALB_STATE" = "active" ]; then
              break
            fi
            sleep 10
          done

          [ -n "$NEXUS_ALB_DNS" ] && [ "$NEXUS_ALB_DNS" != "None" ] && [ "$NEXUS_ALB_STATE" = "active" ] || { echo "Nexus ALB $NEXUS_ALB_NAME not active in $(AWS_REGION) (state: ${NEXUS_ALB_STATE:-unknown})" >&2; exit 1; }

          aws route53 change-resource-record-sets --hosted-zone-id "$HOSTED_ZONE_ID" --change-batch "{
            \"Changes\": [{
              \"Action\": \"UPSERT\",
              \"ResourceRecordSet\": {
                \"Name\": \"${NEXUS_DOMAIN}\",
                \"Type\": \"A\",
                \"AliasTarget\": {
                  \"HostedZoneId\": \"${NEXUS_ALB_ZONE}\",
                  \"DNSName\": \"${NEXUS_ALB_DNS}\",
                  \"EvaluateTargetHealth\": false
                }
              }
            }]
          }"

    - task: AWSShellScript@1
      displayName: Link Terraform NLB to ALB
      inputs:
        awsCredentials: $(AWS_SERVICE_CONNECTION)
        regionName: $(AWS_REGION)
        scriptType: inline
        inlineScript: |
          set -euo pipefail
          TG_NAME="${{ parameters.env }}-nlb-tg"
          ALB_NAME="${{ parameters.env }}-alb"

          TG_ARN=$(aws elbv2 describe-target-groups --names "$TG_NAME" --query 'TargetGroups[0].TargetGroupArn' --output text)
          [ -n "$TG_ARN" ] && [ "$TG_ARN" != "None" ] || { echo "Target group $TG_NAME not found in $(AWS_REGION)" >&2; exit 1; }

          for i in $(seq 1 40); do
            ALB_ARN=$(aws elbv2 describe-load-balancers --names "$ALB_NAME" --query 'LoadBalancers[0].LoadBalancerArn' --output text 2>/dev/null || true)
            ALB_STATE=$(aws elbv2 describe-load-balancers --names "$ALB_NAME" --query 'LoadBalancers[0].State.Code' --output text 2>/dev/null || true)
            if [ -n "$ALB_ARN" ] && [ "$ALB_ARN" != "None" ] && [ "$ALB_STATE" = "active" ]; then
              break
            fi
            sleep 10
          done

          [ -n "$ALB_ARN" ] && [ "$ALB_ARN" != "None" ] && [ "$ALB_STATE" = "active" ] || { echo "ALB $ALB_NAME not active in $(AWS_REGION) (state: ${ALB_STATE:-unknown})" >&2; exit 1; }

          aws elbv2 register-targets --target-group-arn "$TG_ARN" --targets Id="$ALB_ARN"
