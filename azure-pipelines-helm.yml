trigger: none
pr: none

parameters:
  - name: env
    displayName: Environment
    type: string
    default: nonprod
    values: [nonprod, prod]

variables:
  AWS_REGION: us-east-1
  AWS_SERVICE_CONNECTION: aws-cred

stages:
  - stage: DeployPlatform
    displayName: Deploy Platform Services
    jobs:
      - job: DeployTools
        displayName: Deploy Platform Tools
        pool:
          name: aws-self-hosted
        steps:
          - task: AWSShellScript@1
            displayName: Setup cluster info
            name: setup
            inputs:
              awsCredentials: $(AWS_SERVICE_CONNECTION)
              regionName: $(AWS_REGION)
              scriptType: inline
              inlineScript: |
                set -euo pipefail
                CLUSTER_NAME=$(aws eks list-clusters --query 'clusters[0]' --output text)
                VPC_ID=$(aws eks describe-cluster --name "$CLUSTER_NAME" --query 'cluster.resourcesVpcConfig.vpcId' --output text)
                aws eks update-kubeconfig --region $(AWS_REGION) --name "$CLUSTER_NAME"
                echo "##vso[task.setvariable variable=CLUSTER_NAME;isOutput=true]$CLUSTER_NAME"
                echo "##vso[task.setvariable variable=VPC_ID;isOutput=true]$VPC_ID"
                echo "Cluster: $CLUSTER_NAME"
                echo "VPC: $VPC_ID"

          - task: Bash@3
            displayName: Add Helm repositories
            inputs:
              targetType: inline
              script: |
                helm repo add eks https://aws.github.io/eks-charts
                helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
                helm repo add jetstack https://charts.jetstack.io
                helm repo add argo https://argoproj.github.io/argo-helm
                helm repo add hashicorp https://helm.releases.hashicorp.com
                helm repo add external-secrets https://charts.external-secrets.io
                helm repo update

          - task: HelmDeploy@0
            displayName: Install AWS Load Balancer Controller
            inputs:
              connectionType: None
              namespace: kube-system
              command: upgrade
              chartType: Name
              chartName: eks/aws-load-balancer-controller
              releaseName: aws-load-balancer-controller
              overrideValues: clusterName=$(setup.CLUSTER_NAME),region=$(AWS_REGION),vpcId=$(setup.VPC_ID)
              install: true
              waitForExecution: true
              arguments: --timeout 10m

          - task: HelmDeploy@0
            displayName: Install ingress-nginx
            inputs:
              connectionType: None
              namespace: ingress-nginx
              command: upgrade
              chartType: Name
              chartName: ingress-nginx/ingress-nginx
              releaseName: ingress-nginx
              overrideValues: controller.service.type=LoadBalancer,controller.service.annotations."service\.beta\.kubernetes\.io/aws-load-balancer-type"=nlb,controller.service.annotations."service\.beta\.kubernetes\.io/aws-load-balancer-scheme"=internet-facing
              install: true
              waitForExecution: true
              arguments: --create-namespace --timeout 10m

          - task: HelmDeploy@0
            displayName: Install cert-manager
            inputs:
              connectionType: None
              namespace: cert-manager
              command: upgrade
              chartType: Name
              chartName: jetstack/cert-manager
              releaseName: cert-manager
              overrideValues: installCRDs=true
              install: true
              waitForExecution: true
              arguments: --create-namespace --timeout 10m

          - task: HelmDeploy@0
            displayName: Install Argo CD
            inputs:
              connectionType: None
              namespace: argocd
              command: upgrade
              chartType: Name
              chartName: argo/argo-cd
              releaseName: argocd
              install: true
              waitForExecution: true
              arguments: --create-namespace --timeout 10m

          - task: HelmDeploy@0
            displayName: Install Vault
            inputs:
              connectionType: None
              namespace: vault
              command: upgrade
              chartType: Name
              chartName: hashicorp/vault
              releaseName: vault
              overrideValues: server.dev.enabled=true,server.dev.devRootToken=root
              install: true
              waitForExecution: true
              arguments: --create-namespace --timeout 10m

          - task: HelmDeploy@0
            displayName: Install External Secrets Operator
            inputs:
              connectionType: None
              namespace: external-secrets
              command: upgrade
              chartType: Name
              chartName: external-secrets/external-secrets
              releaseName: external-secrets
              install: true
              waitForExecution: true
              arguments: --create-namespace --timeout 10m

          - task: Bash@3
            displayName: Deployment Summary
            inputs:
              targetType: inline
              script: |
                echo "========================================="
                echo "PLATFORM DEPLOYMENT COMPLETE"
                echo "========================================="
                echo "Cluster: $(setup.CLUSTER_NAME)"
                NLB_DNS=$(kubectl get svc -n ingress-nginx ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
                echo "NLB DNS: $NLB_DNS"
                echo "========================================="