trigger: none
pr: none

parameters:
  - name: env
    displayName: Environment
    type: string
    default: nonprod
    values: [nonprod, prod]

variables:
  AWS_REGION: us-east-1
  AWS_SERVICE_CONNECTION: aws-cred
  GIT_SERVICE_CONNECTION: git
  # DATADOG_API_KEY: $(DATADOG_API_KEY) # Set this in pipeline variables
  # DATADOG_APP_KEY: $(DATADOG_APP_KEY) # Set this in pipeline variables

stages:
  - stage: DeployPlatform
    displayName: Deploy Platform Services
    jobs:
      - job: DeployTools
        displayName: Deploy Platform Tools
        pool:
          name: aws-self-hosted

        steps:
          - checkout: self
            persistCredentials: true

          - task: AWSShellScript@1
            displayName: Setup cluster + export AWS creds for Helm tasks
            name: setup
            inputs:
              awsCredentials: $(AWS_SERVICE_CONNECTION)
              regionName: $(AWS_REGION)
              scriptType: inline
              inlineScript: |
                set -euo pipefail

                AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"

                CLUSTER_NAME="$(aws eks list-clusters --query 'clusters[0]' --output text)"
                if [ -z "${CLUSTER_NAME}" ] || [ "${CLUSTER_NAME}" = "None" ]; then
                  echo "No EKS clusters found in $(AWS_REGION)"
                  exit 1
                fi

                VPC_ID="$(aws eks describe-cluster --name "${CLUSTER_NAME}" --query 'cluster.resourcesVpcConfig.vpcId' --output text)"

                NLB_TG_ARN=$(aws elbv2 describe-target-groups \
                  --query "TargetGroups[?TargetGroupName=='nonprod-nlb-tg'].TargetGroupArn" \
                  --output text)
                
                aws eks update-kubeconfig --region "$(AWS_REGION)" --name "${CLUSTER_NAME}"
              
                echo "##vso[task.setvariable variable=AWS_ACCOUNT_ID]${AWS_ACCOUNT_ID}"
                echo "##vso[task.setvariable variable=CLUSTER_NAME]${CLUSTER_NAME}"
                echo "##vso[task.setvariable variable=VPC_ID]${VPC_ID}"
                echo "##vso[task.setvariable variable=NLB_TG_ARN]${NLB_TG_ARN}"
                echo "##vso[task.setvariable variable=AWS_ACCESS_KEY_ID;issecret=true]${AWS_ACCESS_KEY_ID}"
                echo "##vso[task.setvariable variable=AWS_SECRET_ACCESS_KEY;issecret=true]${AWS_SECRET_ACCESS_KEY}"
                echo "##vso[task.setvariable variable=AWS_SESSION_TOKEN;issecret=true]${AWS_SESSION_TOKEN:-}"

          - task: Bash@3
            displayName: Add Helm repositories
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_SESSION_TOKEN: $(AWS_SESSION_TOKEN)
              AWS_DEFAULT_REGION: $(AWS_REGION)
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                helm repo add eks https://aws.github.io/eks-charts
                helm repo add jetstack https://charts.jetstack.io
                helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
                helm repo add argo https://argoproj.github.io/argo-helm
                helm repo add hashicorp https://helm.releases.hashicorp.com
                helm repo add external-secrets https://charts.external-secrets.io
                helm repo add datadog https://helm.datadoghq.com
                helm repo add sonarqube https://SonarSource.github.io/helm-chart-sonarqube
                helm repo update

          - task: HelmDeploy@1
            displayName: Install NGINX Ingress Controller
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_SESSION_TOKEN: $(AWS_SESSION_TOKEN)
              AWS_DEFAULT_REGION: $(AWS_REGION)
            inputs:
              connectionType: None
              namespace: ingress-nginx
              command: upgrade
              chartType: Name
              chartName: ingress-nginx/ingress-nginx
              releaseName: ingress-nginx
              install: true
              waitForExecution: true
              arguments: >
                --create-namespace
                --timeout 10m
                --set controller.tolerations[0].key=platform
                --set controller.tolerations[0].operator=Equal
                --set controller.tolerations[0].value=true
                --set controller.tolerations[0].effect=NoSchedule
                --set controller.service.type=LoadBalancer
                --set controller.service.annotations."service\.beta\.kubernetes\.io/aws-load-balancer-type"=nlb-ip
                --set controller.service.annotations."service\.beta\.kubernetes\.io/aws-load-balancer-scheme"=internal
                --set controller.service.annotations."service\.beta\.kubernetes\.io/aws-load-balancer-target-group-arn"=$(NLB_TG_ARN)
                --set controller.service.annotations."service\.beta\.kubernetes\.io/aws-load-balancer-attributes"=load_balancing.cross_zone.enabled=true
                --set controller.publishService.enabled=true
                --set controller.ingressClassResource.default=true

          - task: HelmDeploy@1
            displayName: Install External Secrets Operator
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_SESSION_TOKEN: $(AWS_SESSION_TOKEN)
              AWS_DEFAULT_REGION: $(AWS_REGION)
            inputs:
              connectionType: None
              namespace: external-secrets
              command: upgrade
              chartType: Name
              chartName: external-secrets/external-secrets
              releaseName: external-secrets
              install: true
              waitForExecution: true
              arguments: >
                --create-namespace
                --timeout 10m
                --set tolerations[0].key=platform
                --set tolerations[0].operator=Equal
                --set tolerations[0].value=true
                --set tolerations[0].effect=NoSchedule
                --set installCRDs=true
                --set serviceAccount.create=true
                --set serviceAccount.name=external-secrets
                --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=arn:aws:iam::$(AWS_ACCOUNT_ID):role/$(CLUSTER_NAME)-external_secrets-irsa

          - task: HelmDeploy@1
            displayName: Install Argo CD
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_SESSION_TOKEN: $(AWS_SESSION_TOKEN)
              AWS_DEFAULT_REGION: $(AWS_REGION)
            inputs:
              connectionType: None
              namespace: argocd
              command: upgrade
              chartType: Name
              chartName: argo/argo-cd
              releaseName: argocd
              install: true
              waitForExecution: true
              arguments: >
                --create-namespace
                --timeout 10m
                --set controller.tolerations[0].key=platform
                --set controller.tolerations[0].operator=Equal
                --set controller.tolerations[0].value=true
                --set controller.tolerations[0].effect=NoSchedule
                --set server.tolerations[0].key=platform
                --set server.tolerations[0].operator=Equal
                --set server.tolerations[0].value=true
                --set server.tolerations[0].effect=NoSchedule
                --set repoServer.tolerations[0].key=platform
                --set repoServer.tolerations[0].operator=Equal
                --set repoServer.tolerations[0].value=true
                --set repoServer.tolerations[0].effect=NoSchedule
                --set server.service.type=ClusterIP
                --set server.ingress.enabled=true
                --set server.ingress.ingressClassName=nginx

          - task: HelmDeploy@1
            displayName: Install SonarQube
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_SESSION_TOKEN: $(AWS_SESSION_TOKEN)
              AWS_DEFAULT_REGION: $(AWS_REGION)
            inputs:
              connectionType: None
              namespace: sonarqube
              command: upgrade
              chartType: Name
              chartName: sonarqube/sonarqube
              releaseName: sonarqube
              install: true
              waitForExecution: true
              arguments: >
                --create-namespace
                --timeout 15m
                --set tolerations[0].key=platform
                --set tolerations[0].operator=Equal
                --set tolerations[0].value=true
                --set tolerations[0].effect=NoSchedule
                --set edition=community
                --set monitoringPasscode=changeMe
                --set service.type=ClusterIP
                --set ingress.enabled=true
                --set ingress.ingressClassName=nginx
                --set postgresql.enabled=true
                --set postgresql.auth.password=sonarpass