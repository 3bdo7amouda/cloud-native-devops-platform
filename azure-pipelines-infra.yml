trigger: none
pr: none

parameters:
  - name: env
    displayName: Environment
    type: string
    default: prod
    values: [nonprod, prod]

  - name: destroy
    displayName: Destroy
    type: boolean
    default: false

variables:
  TF_DIR: terraform
  TF_VAR_FILE: '${{ parameters.env }}.tfvars'
  AWS_SERVICE_CONNECTION: hamouda
  AWS_REGION: us-east-1

stages:
  - stage: Infra
    displayName: Infra (Terraform)
    jobs:
      - job: Terraform
        displayName: Terraform
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: latest

          - task: AWSShellScript@1
            displayName: Terraform init
            inputs:
              awsCredentials: $(AWS_SERVICE_CONNECTION)
              regionName: $(AWS_REGION)
              scriptType: inline
              inlineScript: |
                set -euo pipefail
                cd "$(TF_DIR)"
                terraform init -input=false

          - task: AWSShellScript@1
            displayName: Terraform plan
            condition: eq('${{ parameters.destroy }}', false)
            inputs:
              awsCredentials: $(AWS_SERVICE_CONNECTION)
              regionName: $(AWS_REGION)
              scriptType: inline
              inlineScript: |
                set -euo pipefail
                cd "$(TF_DIR)"
                terraform plan -out=tfplan -input=false -var-file="$(TF_VAR_FILE)"

          - task: AWSShellScript@1
            displayName: Terraform plan -destroy
            condition: eq('${{ parameters.destroy }}', true)
            inputs:
              awsCredentials: $(AWS_SERVICE_CONNECTION)
              regionName: $(AWS_REGION)
              scriptType: inline
              inlineScript: |
                set -euo pipefail
                cd "$(TF_DIR)"
                terraform plan -destroy -out=tfplan -input=false -var-file="$(TF_VAR_FILE)"

          - task: AWSShellScript@1
            displayName: Terraform apply
            inputs:
              awsCredentials: $(AWS_SERVICE_CONNECTION)
              regionName: $(AWS_REGION)
              scriptType: inline
              inlineScript: |
                set -euo pipefail
                cd "$(TF_DIR)"
                terraform apply -auto-approve -input=false tfplan

  - stage: Platform
    displayName: Platform (EKS + Helm)
    dependsOn: Infra
    condition: and(succeeded(), eq('${{ parameters.destroy }}', false))
    jobs:
      - job: DeployPlatform
        displayName: Deploy platform charts
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - task: KubectlInstaller@0
            displayName: Install kubectl
            inputs:
              kubectlVersion: latest

          - task: HelmInstaller@1
            displayName: Install Helm
            inputs:
              helmVersionToInstall: latest

          - task: AWSShellScript@1
            displayName: Configure kubeconfig + Deploy charts
            inputs:
              awsCredentials: $(AWS_SERVICE_CONNECTION)
              regionName: $(AWS_REGION)
              scriptType: inline
              inlineScript: |
                set -euo pipefail

                : "${DD_API_KEY:?DD_API_KEY pipeline variable is required}"

                cd "$(TF_DIR)"
                CLUSTER_NAME="$(terraform output -raw cluster_name)"

                export KUBECONFIG="$(Pipeline.Workspace)/kubeconfig"
                aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$(AWS_REGION)" --kubeconfig "$KUBECONFIG"

                kubectl get nodes

                helm repo add argo https://argoproj.github.io/argo-helm
                helm repo add sonarqube https://SonarSource.github.io/helm-chart-sonarqube
                helm repo add hashicorp https://helm.releases.hashicorp.com
                helm repo add external-secrets https://charts.external-secrets.io
                helm repo add datadog https://helm.datadoghq.com
                helm repo update

                helm upgrade --install argocd argo/argo-cd \
                  --namespace argocd --create-namespace \
                  --wait --rollback-on-failure --timeout 15m

                helm upgrade --install sonarqube sonarqube/sonarqube \
                  --namespace sonarqube --create-namespace \
                  --wait --rollback-on-failure --timeout 20m

                helm upgrade --install vault hashicorp/vault \
                  --namespace vault --create-namespace \
                  --wait --rollback-on-failure --timeout 20m

                helm upgrade --install external-secrets external-secrets/external-secrets \
                  --namespace external-secrets --create-namespace \
                  --wait --rollback-on-failure --timeout 10m

                helm upgrade --install datadog datadog/datadog \
                  --namespace datadog --create-namespace \
                  --wait --rollback-on-failure --timeout 15m \
                  --set datadog.apiKey="$(DD_API_KEY)" \
                  --set datadog.site=datadoghq.com