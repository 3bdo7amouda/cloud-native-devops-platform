trigger: none
pr: none

parameters:
  - name: env
    displayName: Environment
    type: string
    default: nonprod
    values: [nonprod, prod]

  - name: destroy
    displayName: Destroy
    type: boolean
    default: false

variables:
  TF_DIR: terraform
  TF_VAR_FILE: '${{ parameters.env }}.tfvars'
  AWS_SERVICE_CONNECTION: aws-cred
  AWS_REGION: us-east-1

stages:
  - stage: Infra
    displayName: Infra (Terraform)
    jobs:
      - job: Terraform
        displayName: Terraform
        pool:
          name: aws-self-hosted
        steps:
          - checkout: self

          - task: AWSShellScript@1
            displayName: Terraform init
            inputs:
              awsCredentials: $(AWS_SERVICE_CONNECTION)
              regionName: $(AWS_REGION)
              scriptType: inline
              inlineScript: |
                set -euo pipefail
                cd "$(TF_DIR)"
                terraform init -input=false

          - task: AWSShellScript@1
            displayName: Terraform plan
            condition: eq('${{ parameters.destroy }}', false)
            inputs:
              awsCredentials: $(AWS_SERVICE_CONNECTION)
              regionName: $(AWS_REGION)
              scriptType: inline
              inlineScript: |
                set -euo pipefail
                cd "$(TF_DIR)"
                terraform plan -out=tfplan -input=false -var-file="$(TF_VAR_FILE)"

          - task: AWSShellScript@1
            displayName: Terraform plan -destroy
            condition: eq('${{ parameters.destroy }}', true)
            inputs:
              awsCredentials: $(AWS_SERVICE_CONNECTION)
              regionName: $(AWS_REGION)
              scriptType: inline
              inlineScript: |
                set -euo pipefail
                cd "$(TF_DIR)"
                terraform plan -destroy -out=tfplan -input=false -var-file="$(TF_VAR_FILE)"

          - task: AWSShellScript@1
            displayName: Terraform apply
            inputs:
              awsCredentials: $(AWS_SERVICE_CONNECTION)
              regionName: $(AWS_REGION)
              scriptType: inline
              inlineScript: |
                set -euo pipefail
                cd "$(TF_DIR)"
                terraform apply -auto-approve -input=false tfplan
                
                echo "================================"
                echo "Terraform Outputs:"
                echo "================================"
                terraform output
                echo "================================"

          - task: AWSShellScript@1
            displayName: Patch kube-system addons tolerations (platform taint)
            condition: eq('${{ parameters.destroy }}', false)
            inputs:
              awsCredentials: $(AWS_SERVICE_CONNECTION)
              regionName: $(AWS_REGION)
              scriptType: inline
              inlineScript: |
                set -euo pipefail

                CLUSTER_NAME=$(aws eks list-clusters --region $(AWS_REGION) --query 'clusters[0]' --output text)
                aws eks update-kubeconfig --region $(AWS_REGION) --name ${CLUSTER_NAME}

                echo "Patching CoreDNS tolerations..."
                kubectl -n kube-system patch deploy coredns --type='json' -p='[
                  {"op":"add","path":"/spec/template/spec/tolerations/-","value":{"key":"platform","operator":"Equal","value":"true","effect":"NoSchedule"}}
                ]' || true

                echo "Patching EBS CSI controller tolerations..."
                kubectl -n kube-system patch deploy ebs-csi-controller --type='json' -p='[
                  {"op":"add","path":"/spec/template/spec/tolerations/-","value":{"key":"platform","operator":"Equal","value":"true","effect":"NoSchedule"}}
                ]' || true

                kubectl -n kube-system rollout status deploy/coredns --timeout=10m
                kubectl -n kube-system rollout status deploy/ebs-csi-controller --timeout=10m

                echo "kube-system pods (summary):"
                kubectl -n kube-system get pods -o wide | cat