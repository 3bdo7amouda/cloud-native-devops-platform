trigger:
  branches:
    include:
      - main
  paths:
    include:
      - voting-app/*

pr: none

variables:
  NEXUS_REGISTRY: nexus.3bdo7amouda.tech
  NEXUS_REPO: voting-app
  IMAGE_TAG: $(Build.BuildId)
  DEPLOY_ENV: nonprod
  AWS_REGION: us-east-1
  AWS_SERVICE_CONNECTION: aws-cred
  SONARQUBE_SERVICE_CONNECTION: sonarqube
  SONAR_PROJECT_KEY: voting-app

stages:
  - stage: SecurityScan
    displayName: Security Scanning
    condition: succeeded()
    jobs:
      - job: Gitleaks
        displayName: Gitleaks Secret Scan - Full Repository
        pool:
          name: aws-self-hosted
        steps:
          - checkout: self
            fetchDepth: 0
            displayName: Checkout Full Repository

          - task: Gitleaks@3
            displayName: Scan Entire Repository for Secrets
            inputs:
              scanlocation: '$(Build.SourcesDirectory)'
              configtype: 'predefined'
              predefinedconfigfile: 'GitleaksUdmCombo.toml'
              scanmode: 'all'
              reportformat: 'sarif'
              uploadresults: true
              reportartifactname: 'CodeAnalysisLogs'
              taskfail: true
              verbose: true
              redact: true

  - stage: CodeQuality
    displayName: SonarQube Scan
    dependsOn: SecurityScan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: SonarQube
        displayName: SonarQube Scan
        pool:
          name: aws-self-hosted
        steps:
          - checkout: self
            fetchDepth: 0

          - task: AWSShellScript@1
            displayName: Resolve SonarQube URL
            name: sonarUrl
            inputs:
              awsCredentials: $(AWS_SERVICE_CONNECTION)
              regionName: $(AWS_REGION)
              scriptType: inline
              inlineScript: |
                set -euo pipefail
                ALB_NAME="$(DEPLOY_ENV)-alb"
                ALB_DNS=$(aws elbv2 describe-load-balancers --names "$ALB_NAME" --query 'LoadBalancers[0].DNSName' --output text)
                if [ -z "$ALB_DNS" ] || [ "$ALB_DNS" = "None" ]; then
                  echo "ALB $ALB_NAME not found in $(AWS_REGION)" >&2
                  exit 1
                fi
                SONAR_URL="http://$ALB_DNS/api/sonarqube"
                echo "Resolved SonarQube URL: $SONAR_URL"
                echo "##vso[task.setvariable variable=SONAR_HOST_URL]$SONAR_URL"

          - task: SonarQubePrepare@8
            displayName: Prepare SonarQube Analysis
            inputs:
              SonarQube: $(SONARQUBE_SERVICE_CONNECTION)
              scannerMode: 'cli'
              configMode: 'manual'
              cliProjectKey: $(SONAR_PROJECT_KEY)
              cliSources: voting-app
              extraProperties: |
                sonar.host.url=$(SONAR_HOST_URL)

          - task: Bash@3
            displayName: Strip branch/PR params (Community)
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                python3 - <<'PY'
                import json, os
                params = json.loads(os.environ.get("SONARQUBE_SCANNER_PARAMS", "{}"))
                for k in ("sonar.branch.name","sonar.pullrequest.key","sonar.pullrequest.branch","sonar.pullrequest.base"):
                    params.pop(k, None)
                print(f"##vso[task.setvariable variable=SONARQUBE_SCANNER_PARAMS]{json.dumps(params)}")
                PY

          - task: SonarQubeAnalyze@8
            displayName: Run SonarQube Analysis
            inputs:
              jdkversion: JAVA_HOME

          - task: SonarQubePublish@8
            displayName: Publish Quality Gate
            inputs:
              pollingTimeoutSec: '300'

  - stage: Build
    displayName: Build and Push Images
    dependsOn:
      - SecurityScan
      - CodeQuality
    condition: and(succeeded(), or(ne(variables['Build.SourceBranch'], 'refs/heads/main'), eq(dependencies.CodeQuality.result, 'Succeeded')))
    jobs:
      - job: BuildVote
        displayName: Build Vote Service
        pool:
          name: aws-self-hosted
        steps:
          - task: Docker@2
            displayName: Build and Push Vote
            inputs:
              command: buildAndPush
              containerRegistry: nexus
              repository: $(NEXUS_REPO)/vote
              Dockerfile: voting-app/vote/Dockerfile
              buildContext: voting-app/vote
              tags: |
                $(IMAGE_TAG)
                latest

      - job: BuildResult
        displayName: Build Result Service
        pool:
          name: aws-self-hosted
        steps:
          - task: Docker@2
            displayName: Build and Push Result
            inputs:
              command: buildAndPush
              containerRegistry: nexus
              repository: $(NEXUS_REPO)/result
              Dockerfile: voting-app/result/Dockerfile
              buildContext: voting-app/result
              tags: |
                $(IMAGE_TAG)
                latest

      - job: BuildWorker
        displayName: Build Worker Service
        pool:
          name: aws-self-hosted
        steps:
          - task: Docker@2
            displayName: Build and Push Worker
            inputs:
              command: buildAndPush
              containerRegistry: nexus
              repository: $(NEXUS_REPO)/worker
              Dockerfile: voting-app/worker/Dockerfile
              buildContext: voting-app/worker
              tags: |
                $(IMAGE_TAG)
                latest

  - stage: ImageScan
    displayName: Container Image Security Scan
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: TrivyVote
        displayName: Trivy Scan - Vote Image
        pool:
          name: aws-self-hosted
        steps:
          - task: Docker@2
            displayName: Login to Nexus
            inputs:
              command: login
              containerRegistry: nexus

          - task: trivy@2
            displayName: Scan Vote Image
            continueOnError: true
            inputs:
              type: 'image'
              target: '$(NEXUS_REGISTRY)/$(NEXUS_REPO)/vote:$(IMAGE_TAG)'
              scanners: 'vuln,secret,misconfig'
              severity: 'CRITICAL,HIGH'

      - job: TrivyResult
        displayName: Trivy Scan - Result Image
        pool:
          name: aws-self-hosted
        steps:
          - task: Docker@2
            displayName: Login to Nexus
            inputs:
              command: login
              containerRegistry: nexus

          - task: trivy@2
            displayName: Scan Result Image
            continueOnError: true
            inputs:
              type: 'image'
              target: '$(NEXUS_REGISTRY)/$(NEXUS_REPO)/result:$(IMAGE_TAG)'
              scanners: 'vuln,secret,misconfig'
              severity: 'CRITICAL,HIGH'

      - job: TrivyWorker
        displayName: Trivy Scan - Worker Image
        pool:
          name: aws-self-hosted
        steps:
          - task: Docker@2
            displayName: Login to Nexus
            inputs:
              command: login
              containerRegistry: nexus

          - task: trivy@2
            displayName: Scan Worker Image
            continueOnError: true
            inputs:
              type: 'image'
              target: '$(NEXUS_REGISTRY)/$(NEXUS_REPO)/worker:$(IMAGE_TAG)'
              scanners: 'vuln,secret,misconfig'
              severity: 'CRITICAL,HIGH'
