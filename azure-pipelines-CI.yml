trigger:
  branches:
    include:
      - main
  paths:
    include:
      - voting-app/*

pr: none

variables:
  NEXUS_REGISTRY: 172.30.2.117:5000
  NEXUS_REPO: voting-app
  IMAGE_TAG: $(Build.BuildId)

stages:
  - stage: SecurityScan
    displayName: Security Scanning
    jobs:
      - job: Gitleaks
        displayName: Gitleaks Secret Scan - Full Repository
        pool:
          name: aws-self-hosted
        steps:
          - checkout: self
            fetchDepth: 0
            displayName: Checkout Full Repository
            
          - task: Gitleaks@3
            displayName: Scan Entire Repository for Secrets
            inputs:
              scanlocation: '$(Build.SourcesDirectory)'
              configtype: 'predefined'
              predefinedconfigfile: 'GitleaksUdmCombo.toml'
              scanmode: 'all'
              reportformat: 'sarif'
              uploadresults: true
              reportartifactname: 'CodeAnalysisLogs'
              taskfail: true
              verbose: true
              redact: true

  - stage: CodeQuality
    displayName: Code Quality Analysis
    dependsOn: SecurityScan
    condition: succeeded()
    jobs:
      - job: SonarQubeAnalysis
        displayName: SonarQube Code Analysis
        pool:
          name: aws-self-hosted
        steps:
          - checkout: self
            fetchDepth: 0
            displayName: Checkout Full Repository

          - task: Bash@3
            displayName: Get SonarQube Token from Kubernetes Secret
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                
                # Get token from Kubernetes secret (synced from Vault via ESO)
                SONAR_TOKEN=$(kubectl get secret sonarqube-token -n default -o jsonpath='{.data.token}' | base64 -d)
                SONAR_HOST=$(kubectl get secret sonarqube-token -n default -o jsonpath='{.data.host}' | base64 -d)
                
                echo "##vso[task.setvariable variable=SONAR_TOKEN;issecret=true]$SONAR_TOKEN"
                echo "##vso[task.setvariable variable=SONAR_HOST_URL]$SONAR_HOST"
                
                echo "SonarQube Host: $SONAR_HOST"

          - task: Bash@3
            displayName: Run SonarQube Scanner
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                
                # Download SonarScanner if not present
                if [ ! -d "sonar-scanner" ]; then
                  wget -q https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
                  unzip -q sonar-scanner-cli-5.0.1.3006-linux.zip
                  mv sonar-scanner-5.0.1.3006-linux sonar-scanner
                fi
                
                # Run SonarQube analysis
                ./sonar-scanner/bin/sonar-scanner \
                  -Dsonar.projectKey=voting-app \
                  -Dsonar.projectName="Voting App" \
                  -Dsonar.projectVersion=$(Build.BuildId) \
                  -Dsonar.sources=voting-app \
                  -Dsonar.host.url=$(SONAR_HOST_URL) \
                  -Dsonar.token=$(SONAR_TOKEN) \
                  -Dsonar.exclusions=**/node_modules/**,**/*.spec.ts,**/*.test.js

  - stage: Build
    displayName: Build and Push Images
    dependsOn: CodeQuality
    condition: succeeded()
    jobs:
      - job: BuildVote
        displayName: Build Vote Service
        pool:
          name: aws-self-hosted
        steps:
          - task: Docker@2
            displayName: Build and Push Vote
            inputs:
              command: buildAndPush
              containerRegistry: nexus
              repository: $(NEXUS_REPO)/vote
              Dockerfile: voting-app/vote/Dockerfile
              buildContext: voting-app/vote
              tags: |
                $(IMAGE_TAG)
                latest

      - job: BuildResult
        displayName: Build Result Service
        pool:
          name: aws-self-hosted
        steps:
          - task: Docker@2
            displayName: Build and Push Result
            inputs:
              command: buildAndPush
              containerRegistry: nexus
              repository: $(NEXUS_REPO)/result
              Dockerfile: voting-app/result/Dockerfile
              buildContext: voting-app/result
              tags: |
                $(IMAGE_TAG)
                latest

      - job: BuildWorker
        displayName: Build Worker Service
        pool:
          name: aws-self-hosted
        steps:
          - task: Docker@2
            displayName: Build and Push Worker
            inputs:
              command: buildAndPush
              containerRegistry: nexus
              repository: $(NEXUS_REPO)/worker
              Dockerfile: voting-app/worker/Dockerfile
              buildContext: voting-app/worker
              tags: |
                $(IMAGE_TAG)
                latest

  - stage: ImageScan
    displayName: Container Image Security Scan
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: TrivyVote
        displayName: Trivy Scan - Vote Image
        pool:
          name: aws-self-hosted
        steps:
          - task: Docker@2
            displayName: Login to Nexus
            inputs:
              command: login
              containerRegistry: nexus
          
          - task: trivy@2
            displayName: Scan Vote Image
            continueOnError: true
            inputs:
              type: 'image'
              target: '$(NEXUS_REGISTRY)/$(NEXUS_REPO)/vote:$(IMAGE_TAG)'
              scanners: 'vuln,secret,misconfig'
              severity: 'CRITICAL,HIGH'

      - job: TrivyResult
        displayName: Trivy Scan - Result Image
        pool:
          name: aws-self-hosted
        steps:
          - task: Docker@2
            displayName: Login to Nexus
            inputs:
              command: login
              containerRegistry: nexus
          
          - task: trivy@2
            displayName: Scan Result Image
            continueOnError: true
            inputs:
              type: 'image'
              target: '$(NEXUS_REGISTRY)/$(NEXUS_REPO)/result:$(IMAGE_TAG)'
              scanners: 'vuln,secret,misconfig'
              severity: 'CRITICAL,HIGH'

      - job: TrivyWorker
        displayName: Trivy Scan - Worker Image
        pool:
          name: aws-self-hosted
        steps:
          - task: Docker@2
            displayName: Login to Nexus
            inputs:
              command: login
              containerRegistry: nexus
          
          - task: trivy@2
            displayName: Scan Worker Image
            continueOnError: true
            inputs:
              type: 'image'
              target: '$(NEXUS_REGISTRY)/$(NEXUS_REPO)/worker:$(IMAGE_TAG)'
              scanners: 'vuln,secret,misconfig'
              severity: 'CRITICAL,HIGH'