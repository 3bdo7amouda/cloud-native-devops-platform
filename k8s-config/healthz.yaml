apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthz
  namespace: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: healthz
  template:
    metadata:
      labels:
        app: healthz
    spec:
      containers:
      - name: healthz
        image: hashicorp/http-echo:1.0.0
        args: ["-text=ok", "-listen=:8080"]
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: healthz
  namespace: argocd
spec:
  selector:
    app: healthz
  ports:
  - port: 80
    targetPort: 8080
