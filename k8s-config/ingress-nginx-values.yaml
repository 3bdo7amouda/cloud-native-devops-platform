# Values for ingress-nginx/ingress-nginx chart
# - Designed for clusters where all nodes are tainted (platform=true:NoSchedule)
# - We disable admission webhooks to avoid hook Jobs that otherwise need tolerations

controller:
  service:
    type: ClusterIP
  tolerations:
    - key: platform
      operator: Equal
      value: "true"
      effect: NoSchedule

admissionWebhooks:
  enabled: false

# defaultBackend is disabled by default in this chart.
# If enabled later, keep it schedulable on tainted nodes.
defaultBackend:
  tolerations:
    - key: platform
      operator: Equal
      value: "true"
      effect: NoSchedule
