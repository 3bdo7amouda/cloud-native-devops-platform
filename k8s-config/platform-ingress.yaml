apiVersion: v1
kind: Service
metadata:
  name: sonarqube
  namespace: argocd
spec:
  type: ExternalName
  externalName: sonarqube.sonarqube.svc.cluster.local
  ports:
  - name: http
    port: 9000
    targetPort: 9000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-ingress
  namespace: argocd
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /api/argocd
        pathType: Prefix
        backend:
          service:
            name: argocd-server
            port:
              number: 80
      - path: /api/sonarqube
        pathType: Prefix
        backend:
          service:
            name: sonarqube
            port:
              number: 9000
