replicaCount:
  vote: 1
  worker: 1
  result: 1
  redis: 1

image:
  vote:
    repository: 172.30.2.117:5000/voting-app/vote
    tag: "latest"
    pullPolicy: Always
  worker:
    repository: 172.30.2.117:5000/voting-app/worker
    tag: "latest"
    pullPolicy: Always
  result:
    repository: 172.30.2.117:5000/voting-app/result
    tag: "latest"
    pullPolicy: Always

mongodb:
  secretName: mongodb-atlas-credentials
  secretKey: connection-string
  databaseName: voting

service:
  vote:
    type: LoadBalancer
  result:
    type: LoadBalancer

resources:
  vote:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  worker:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  result:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

ingress:
  enabled: false
