replicaCount:
  vote: 1
  worker: 1
  result: 1
  redis: 1

image:
  vote:
    repository: dockersamples/examplevotingapp_vote
    tag: "latest"
    pullPolicy: IfNotPresent
  worker:
    repository: dockersamples/examplevotingapp_worker
    tag: "latest"
    pullPolicy: IfNotPresent
  result:
    repository: dockersamples/examplevotingapp_result
    tag: "latest"
    pullPolicy: IfNotPresent

mongodb:
  secretName: mongodb-atlas-credentials
  secretKey: connection-string
  databaseName: voting

service:
  vote:
    type: LoadBalancer
  result:
    type: LoadBalancer

resources:
  vote:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  worker:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  result:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

ingress:
  enabled: false
