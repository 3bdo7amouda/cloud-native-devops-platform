apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "voting-app.fullname" . }}-result
  labels:
    {{- include "voting-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: result
spec:
  replicas: {{ .Values.replicaCount.result }}
  selector:
    matchLabels:
      {{- include "voting-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: result
  template:
    metadata:
      labels:
        {{- include "voting-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: result
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: result
        image: "{{ .Values.image.result.repository }}:{{ .Values.image.result.tag }}"
        imagePullPolicy: {{ .Values.image.result.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.result.targetPort }}
          name: http
        env:
        - name: PORT
          value: "{{ .Values.service.result.targetPort }}"
        - name: BASE_PATH
          value: /api/result
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: {{ .Values.mongodb.secretName }}
              key: {{ .Values.mongodb.secretKey }}
        - name: DATABASE_NAME
          value: {{ .Values.mongodb.databaseName | quote }}
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          {{- toYaml .Values.resources.result | nindent 10 }}
