# Production Environment Overrides
replicaCount:
  vote: 3
  worker: 3
  result: 3
  redis: 1

image:
  vote:
    repository: 172.30.2.117:5000/voting-app/vote
    tag: "latest"
    pullPolicy: Always
  worker:
    repository: 172.30.2.117:5000/voting-app/worker
    tag: "latest"
    pullPolicy: Always
  result:
    repository: 172.30.2.117:5000/voting-app/result
    tag: "latest"
    pullPolicy: Always

mongodb:
  secretName: mongodb-atlas-credentials-prod
  secretKey: connection-string
  databaseName: voting-prod

service:
  vote:
    type: LoadBalancer
  result:
    type: LoadBalancer

resources:
  vote:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "400m"
  worker:
    requests:
      memory: "512Mi"
      cpu: "400m"
    limits:
      memory: "1Gi"
      cpu: "800m"
  result:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "400m"

ingress:
  enabled: true
  hosts:
    - host: vote.yourcompany.com
      paths:
        - path: /
          pathType: Prefix
          service: vote
    - host: result.yourcompany.com
      paths:
        - path: /
          pathType: Prefix
          service: result
